x-dev-env: &dev-env
  DJANGO_SETTINGS_MODULE: project.settings_container_dev
  S3_ENDPOINT_URL: http://garage:3900
  S3_REGION: garage
  S3_BUCKET: ${S3_BUCKET:-capexly-synthetic}
services:
  web:
    depends_on:
      garage: {condition: service_healthy}
    build: {context: ., target: development}
    environment: *dev-env
    read_only: false
    volumes: [./:/app, dev_venv:/app/.venv]
    command: [python, manage.py, runserver, '0.0.0.0:8000']
    ports: ['127.0.0.1:8000:8000']
  worker:
    depends_on:
      garage: {condition: service_healthy}
    build: {context: ., target: development}
    environment: *dev-env
    read_only: false
    volumes: [./:/app, dev_venv:/app/.venv]
  beat:
    depends_on:
      garage: {condition: service_healthy}
    build: {context: ., target: development}
    environment: *dev-env
    read_only: false
    volumes: [./:/app, dev_venv:/app/.venv]
  migrate:
    depends_on:
      garage: {condition: service_healthy}
    build: {context: ., target: development}
    environment: *dev-env
    read_only: false
    volumes: [./:/app, dev_venv:/app/.venv]
  frontend-dev:
    image: docker.io/library/node:24.0.0-bookworm-slim@sha256:7b0f9cbb3f88da0e67873be5efcf38ce79ea25cfbb4986fad55a446af484e7c9
    platform: linux/amd64
    working_dir: /app
    volumes: [./:/app, dev_node_modules:/app/node_modules]
    command: [sh, -ec, 'npm ci && npm run dev -- --host 0.0.0.0']
    ports: ['127.0.0.1:5173:5173']
    networks: [egress]
  garage:
    image: capexly-garage-dev:2.4.1
    build:
      context: .
      dockerfile: infra/garage/Dockerfile
    platform: linux/amd64
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    environment:
      S3_BUCKET: ${S3_BUCKET:-capexly-synthetic}
    secrets: [s3_access_key, s3_secret_key, garage_rpc_secret]
    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
    ports: ['127.0.0.1:3900:3900']
    networks: [data]
    healthcheck:
      test: [CMD, /garage, status]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 64
  mailpit:
    image: docker.io/axllent/mailpit:v1.27.8@sha256:6abc8e633df15eaf785cfcf38bae48e66f64beecdc03121e249d0f9ec15f0707
    platform: linux/amd64
    restart: unless-stopped
    ports: ['127.0.0.1:8025:8025']
    volumes: [mailpit_data:/data]
    environment: {MP_DATABASE: /data/mailpit.db}
    networks: [data]
volumes:
  dev_venv:
  dev_node_modules:
  garage_meta:
  garage_data:
  mailpit_data:
secrets:
  garage_rpc_secret:
    file: ${SECRETS_DIR}/garage_rpc_secret
