services:
  caddy:
    image: docker.io/library/caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    platform: linux/amd64
    restart: unless-stopped
    ports: ['80:80', '443:443']
    networks: [proxy, egress]
    environment:
      DOMAIN: ${DOMAIN:?Set domain}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME contact}
      ACME_CA: ${ACME_CA:?Select staging or production explicitly}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: {condition: service_healthy}
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
volumes:
  caddy_data:
  caddy_config:
